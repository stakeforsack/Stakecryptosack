<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CryptoYieldPro — Home</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --accent: #a855f7;
      --accent2: #5eead4;
      --bg1: #050509;
      --bg2: #0b0b11;
      --card: rgba(255,255,255,0.03);
      --muted: #9aa3b2;
      --success: #7ef6b8;
      --danger: #ff6b6b;
    }

    body {
      margin: 0;
      background: linear-gradient(180deg, var(--bg1), var(--bg2));
      font-family: Inter, sans-serif;
      color: #e5eeff;
      overflow-x: hidden;
    }

    .wrap {
      width: 94%;
      margin: 0 auto;
      padding-bottom: 90px;
    }

    /* ---------------- Banner Slider ---------------- */
    .banner-container {
      margin-top: 14px;
      width: 100%;
      height: 140px;
      border-radius: 16px;
      overflow: hidden;
    }

    .banner-slider img {
      width: 100%;
      height: 100%;
      display: none;
      object-fit: cover;
      filter: brightness(1.05) contrast(1.08);
    }

    .banner-slider img.active {
      display: block;
    }

    /* ---------------- Account Balance ---------------- */
    .balance-card {
      background: var(--card);
      margin-top: 20px;
      padding: 18px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .balance-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .balance-value {
      font-size: 1.8rem;
      font-weight: 800;
      color: #fff;
    }

    .badge {
      padding: 6px 12px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      color: #041;
      font-weight: 800;
      border-radius: 999px;
      font-size: 0.8rem;
    }

    /* ---------------- Actions ---------------- */
    .actions {
      margin-top: 16px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .action-btn {
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 14px;
      padding: 12px 6px;
      text-align: center;
      font-size: 0.85rem;
      color: #fff;
      font-weight: 600;
    }

    .action-btn img {
      width: 32px;
      height: 32px;
      margin-bottom: 4px;
    }

    /* ---------------- Market ---------------- */
    .market-section {
      margin-top: 22px;
    }

    .market-row {
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.04);
      padding: 12px;
      border-radius: 14px;
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .change.positive { color: var(--success); }
    .change.negative { color: var(--danger); }

    /* ---------------- Bottom Navigation ---------------- */
    .bottom-nav {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 26px;
      padding: 12px 20px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.04);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      z-index: 9999;
    }

    .nav-item {
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .nav-item img {
      width: 24px !important;
      height: 24px !important;
      margin-bottom: 4px;
      object-fit: contain;
    }

    .nav-item.active {
      color: var(--accent);
    }
  </style>
</head>

<body>
<div class="wrap">

  <!-- Banner Slider -->
  <div class="banner-container">
    <div class="banner-slider" id="bannerSlider">
      <img src="/img/banner_1.png" />
      <img src="/img/banner_2.png" />
      <img src="/img/banner_3.png" />
    </div>
  </div>

  <!-- Account Balance -->
  <div class="balance-card">
    <div class="balance-row">
      <div>
        <div style="color:var(--muted); font-size:0.85rem;">Account Balance</div>
        <div class="balance-value" id="balanceValue">$0.00</div>
      </div>
      <div class="badge" id="membershipBadge">None</div>
    </div>
  </div>

  <!-- Actions -->
  <div class="actions">
    <a class="action-btn" href="deposit.html">
      <img src="/img/deposit.png" />
      Deposit
    </a>
    <a class="action-btn" href="withdraw.html">
      <img src="/img/withdraw.png" />
      Withdraw
    </a>
    <a class="action-btn" href="upgrade.html">
      <img src="/img/vip-card.png" />
      Upgrade
    </a>
    <a class="action-btn" href="internal-transfer.html">
      <img src="/img/money.png" />
      Transfer
    </a>
  </div>

  <!-- Market Section -->
  <div class="market-section">
    <h2>Live Crypto Market</h2>

    <div class="market-row">
      <span>BTC/USDT</span>
      <span class="price" data-price-id="bitcoin">—</span>
      <span class="change" data-change-id="bitcoin"></span>
    </div>

    <div class="market-row">
      <span>ETH/USDT</span>
      <span class="price" data-price-id="ethereum">—</span>
      <span class="change" data-change-id="ethereum"></span>
    </div>

    <div class="market-row">
      <span>BNB/USDT</span>
      <span class="price" data-price-id="binancecoin">—</span>
      <span class="change" data-change-id="binancecoin"></span>
    </div>

    <div class="market-row">
      <span>SOL/USDT</span>
      <span class="price" data-price-id="solana">—</span>
      <span class="change" data-change-id="solana"></span>
    </div>

  </div>

</div>

<!-- Bottom Navigation -->
<nav class="bottom-nav">
  <a class="nav-item active" href="home.html"><img src="/img/house.png"><span>Home</span></a>
  <a class="nav-item" href="trade.html"><img src="/img/trade.png"><span>Trade</span></a>
  <a class="nav-item" href="internal-transfer.html"><img src="/img/transfer.png"><span>Transfer</span></a>
  <a class="nav-item" href="account.html"><img src="/img/myaccount.png"><span>Account</span></a>
</nav>

<script src="/js/market-prices.js"></script>

<script>
/* ---------------- Slider ---------------- */
const bannerImages = document.querySelectorAll("#bannerSlider img");
let index = 0;
bannerImages[0].classList.add("active");

setInterval(() => {
  bannerImages[index].classList.remove("active");
  index = (index + 1) % bannerImages.length;
  bannerImages[index].classList.add("active");
}, 5000);

/* ---------------- Load Profile ---------------- */
async function loadProfile() {
  try {
    const res = await fetch("/api/total-usd", { credentials: "include" });
    const totalData = await res.json();

    const totalUSD = Number(totalData.totalUSD || 0);
    document.getElementById("balanceValue").innerText =
      "$" + totalUSD.toLocaleString(undefined, {
        minimumFractionDigits: 2,
        maximumFractionDigits: 6
      });

    /* Membership Badge */
    const profileRes = await fetch("/api/profile", { credentials: "include" });
    const prof = await profileRes.json();
    const active = (prof.user?.memberships || []).find(m => m.status === "ACTIVE");

    document.getElementById("membershipBadge").innerText =
      active ? active.tier : "None";

  } catch (e) {
    console.log(e);
  }
}

loadProfile();
setInterval(loadProfile, 15000);
</script>

</body>
</html>
