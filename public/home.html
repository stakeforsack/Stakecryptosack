<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CryptoYieldPro — Home</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --accent: #a855f7;
      --accent2: #5eead4;
      --bg1: #050509;
      --bg2: #0b0b11;
      --card: rgba(255,255,255,0.03);
      --muted: #9aa3b2;
      --success: #7ef6b8;
      --danger: #ff6b6b;
    }

    body {
      margin: 0;
      background: linear-gradient(180deg, var(--bg1), var(--bg2));
      font-family: Inter, sans-serif;
      color: #e5eeff;
      overflow-x: hidden;
    }

    .wrap {
      width: 94%;
      margin: 0 auto;
      padding-bottom: 90px;
    }

    /* Banner */
    .banner-container {
      margin-top: 14px;
      width: 100%;
      height: 140px;
      border-radius: 16px;
      overflow: hidden;
    }
    .banner-slider img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }
    .banner-slider img.active {
      display: block;
    }

    /* Balance */
    .balance-card {
      background: var(--card);
      margin-top: 20px;
      padding: 18px;
      border-radius: 16px;
    }
    .balance-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .balance-value {
      font-size: 1.8rem;
      font-weight: 800;
      color: white;
    }
    .badge {
      padding: 6px 12px;
      border-radius: 999px;
      font-weight: 800;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      color: black;
    }

    /* Actions */
    .actions {
      margin-top: 16px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .action-btn {
      background: var(--card);
      border-radius: 14px;
      padding: 12px 6px;
      text-align: center;
      color: white;
      font-weight: 600;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .action-btn img {
      width: 32px;
      height: 32px;
      margin-bottom: 4px;
    }

    /* Market */
    .market-row {
      background: var(--card);
      padding: 12px;
      border-radius: 14px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
    }

    /* Bottom nav */
    .bottom-nav {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 26px;
      padding: 12px 20px;
      background: rgba(255,255,255,0.03);
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.04);
    }
    .nav-item {
      text-align: center;
      color: var(--muted);
    }
    .nav-item.active {
      color: var(--accent);
    }
  </style>
</head>

<body>
<div class="wrap">

  <!-- Banner -->
  <div class="banner-container">
    <div class="banner-slider" id="bannerSlider">
      <img src="/img/banner_1.png">
      <img src="/img/banner_2.png">
      <img src="/img/banner_3.png">
    </div>
  </div>

  <!-- Balance -->
  <div class="balance-card">
    <div class="balance-row">
      <div>
        <div style="color:var(--muted); font-size:0.85rem;">Account Balance</div>
        <div class="balance-value" id="balanceValue">$0.00</div>
      </div>
      <div class="badge" id="membershipBadge">None</div>
    </div>
  </div>

  <!-- Actions -->
  <div class="actions">
    <a class="action-btn" href="deposit.html"><img src="/img/deposit.png">Deposit</a>
    <a class="action-btn" href="withdraw.html"><img src="/img/withdraw.png">Withdraw</a>
    <a class="action-btn" href="upgrade.html"><img src="/img/vip-card.png">Upgrade</a>
    <a class="action-btn" href="internal-transfer.html"><img src="/img/money.png">Transfer</a>
  </div>

  <!-- Market -->
  <div class="market-section">
    <h2>Live Crypto Market</h2>

    <div class="market-row" data-coin="bitcoin">
      <span>BTC/USDT</span>
      <span class="price" data-price-id="bitcoin">—</span>
      <span class="change" data-change-id="bitcoin"></span>
    </div>

    <div class="market-row" data-coin="ethereum">
      <span>ETH/USDT</span>
      <span class="price" data-price-id="ethereum">—</span>
      <span class="change" data-change-id="ethereum"></span>
    </div>

    <div class="market-row" data-coin="binancecoin">
      <span>BNB/USDT</span>
      <span class="price" data-price-id="binancecoin">—</span>
      <span class="change" data-change-id="binancecoin"></span>
    </div>

    <div class="market-row" data-coin="solana">
      <span>SOL/USDT</span>
      <span class="price" data-price-id="solana">—</span>
      <span class="change" data-change-id="solana"></span>
    </div>

    <div class="market-row" data-coin="dogecoin">
      <span>DOGE/USDT</span>
      <span class="price" data-price-id="dogecoin">—</span>
      <span class="change" data-change-id="dogecoin"></span>
    </div>

    <div class="market-row" data-coin="tron">
      <span>TRX/USDT</span>
      <span class="price" data-price-id="tron">—</span>
      <span class="change" data-change-id="tron"></span>
    </div>

  </div>
</div>

<!-- Bottom nav -->
<nav class="bottom-nav">
  <a class="nav-item active" href="home.html"><img src="/img/house.png"><br>Home</a>
  <a class="nav-item" href="trade.html"><img src="/img/trade.png"><br>Trade</a>
  <a class="nav-item" href="internal-transfer.html"><img src="/img/transfer.png"><br>Transfer</a>
  <a class="nav-item" href="account.html"><img src="/img/myaccount.png"><br>Account</a>
</nav>

<!-- Load market prices -->
<script src="/js/market-prices.js" defer></script>

<script>
/* Banner */
const slider = document.getElementById("bannerSlider");
const imgs = slider.querySelectorAll("img");
let idx = 0;

imgs[0].classList.add("active");

setInterval(() => {
  imgs.forEach(i => i.classList.remove("active"));
  idx = (idx + 1) % imgs.length;
  imgs[idx].classList.add("active");
}, 5000);

/* Profile / Balance */
async function loadProfile() {
  try {
    const r1 = await fetch("/api/profile", { credentials: "include" });
    const r2 = await fetch("/api/total-usd", { credentials: "include" });

    if (r1.status === 401) return;

    const profile = await r1.json();
    const usd = await r2.json();

    const total = Number(usd.totalUSD || 0);

    document.getElementById("balanceValue").innerText =
      "$" + total.toLocaleString(undefined, {
        minimumFractionDigits: 2,
        maximumFractionDigits: 6
      });

    const active = (profile.user?.memberships || []).find(m => m.status === "ACTIVE");
    document.getElementById("membershipBadge").innerText = active ? active.tier : "None";

  } catch(e) {
    console.log("Profile load error:", e);
  }
}

loadProfile();
setInterval(loadProfile, 15000);
</script>

</body>
</html>
