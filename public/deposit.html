<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deposit | CryptoYieldPro</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #050507;
      --card: #0e0e13;
      --accent: #a855f7;
      --accent2: #5eead4;
      --muted: #9aa3b2;
      --glass: rgba(255,255,255,0.03);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: linear-gradient(180deg,#040407,#09090f);
      color: #fff;
      font-family: Inter, sans-serif;
      padding: 20px;
      min-height: 100vh;
    }

    .back-btn {
      position: fixed;
      top: 18px;
      left: 18px;
      background: rgba(255,255,255,0.08);
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.1);
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      backdrop-filter: blur(6px);
      z-index: 50;
    }

    .container {
      max-width: 620px;
      margin: 80px auto;
      background: var(--glass);
      padding: 28px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.06);
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 35px rgba(0,0,0,0.5);
    }

    h2 {
      text-align: center;
      background: linear-gradient(90deg,var(--accent),var(--accent2));
      -webkit-background-clip:text;background-clip:text;
      color: transparent;
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--muted);
      font-size: 0.9rem;
    }

    select, input {
      width: 100%;
      padding: 14px;
      background: #0c0c11;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      color: #fff;
      font-size: 1rem;
    }

    select:focus, input:focus {
      border-color: var(--accent);
      outline: none;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg,var(--accent),var(--accent2));
      color: #031;
      font-weight: 800;
      cursor: pointer;
      transition: .2s;
    }

    .error {
      margin-top: 12px;
      background: rgba(255,75,75,0.15);
      padding: 10px;
      border-radius: 8px;
      color: #ff6b6b;
      display: none;
    }

    .payment-section { display:none; margin-top:28px; padding-top:20px; border-top:1px solid rgba(255,255,255,0.08); }
    .payment-section.active { display:block; }

    .status-box {
      padding: 16px;
      border-radius: 12px;
      background: rgba(255,255,255,0.03);
      border-left: 4px solid #fbbf24;
    }

    .qr-code {
      width: 220px;
      height: 220px;
      background: #fff;
      padding: 10px;
      border-radius: 10px;
      margin: 20px auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .address-box {
      padding: 12px;
      background: rgba(255,255,255,0.05);
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.08);
      word-wrap: break-word;
    }

    .copy-btn {
      width: 100%;
      padding: 12px;
      background: var(--accent2);
      border: none;
      color: #041;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 12px;
    }

  </style>
</head>

<body>

  <div class="back-btn" onclick="location.href='home.html'">← Back</div>

  <div class="container">

    <h2>Deposit Funds</h2>

    <form id="depositForm">

      <label>Select Cryptocurrency</label>
      <select id="coin" required>
        <option selected disabled>Select Coin</option>
        <option value="BTC">Bitcoin (BTC)</option>
        <option value="ETH">Ethereum (ETH)</option>
        <option value="USDT">Tether (USDT)</option>
        <option value="XRP">XRP (XRP)</option>
      </select>

      <!-- 🔥 NEW CHAIN SELECTOR -->
      <label style="margin-top:16px;">Select Network</label>
      <select id="chain" required>
        <option selected disabled>Select Chain</option>
      </select>

      <label style="margin-top:16px;">Amount</label>
      <input id="amount" type="number" placeholder="Enter amount" step="0.0001" min="0" required>

      <div id="error" class="error"></div>

      <button id="submitBtn" type="submit">Proceed</button>
    </form>

    <!-- PAYMENT SECTION -->
    <div id="paymentSection" class="payment-section">

      <div class="status-box">
        <div style="font-weight:700;margin-bottom:5px;">Payment Status:</div>
        <div id="statusValue" style="font-size:1.1rem;color:#fbbf24">Awaiting Payment…</div>
      </div>

      <p style="margin-top:15px;color:var(--muted)">Transaction ID:</p>
      <div id="txId" style="font-family:monospace;opacity:.8;margin-bottom:10px;"></div>

      <p style="margin-top:5px;">Send exactly <span id="exactAmount"></span> <span id="coinSymbol"></span></p>

      <div class="qr-code">
        <img id="qrImage" src="" style="width:100%;height:100%;object-fit:contain;">
      </div>

      <p style="margin-top:10px;">Deposit Address:</p>
      <div id="addressBox" class="address-box"></div>

      <button class="copy-btn" onclick="copyAddress()">Copy Address</button>

      <button class="copy-btn" style="margin-top:16px;background:var(--accent)" onclick="checkPaymentStatus()">Check Status</button>

      <button class="copy-btn" style="margin-top:16px;background:#444;color:#fff" onclick="goBack()">New Deposit</button>

    </div>

  </div>

<script>
const baseUrl = window.location.origin;


// 🔐 Check login before allowing deposit page
async function ensureLoggedIn() {
  try {
    const res = await fetch("/api/profile", { credentials: "include" });
    if (res.status === 401) {
      // Not logged in -> redirect
      window.location.href = "login.html";
      return false;
    }
    return true;
  } catch {
    window.location.href = "login.html";
    return false;
  }
}

ensureLoggedIn();


// ⚡ NETWORK OPTIONS
const chainOptions = {
  BTC: ["Bitcoin"],
  ETH: ["ERC20"],
  USDT: ["TRC20", "ERC20", "BEP20"],
  XRP: ["XRP"]
};

// ⚡ PLACEHOLDER ADDRESSES YOU WILL EDIT
const cryptoData = {
  BTC: {
    Bitcoin: { address: "bc1qaq2ffv87mmn9jhud60s8zhnk5ycguk2umxjcxt", qr: "public\img\qr_btc.png" }
  },
  ETH: {
    ERC20: { address: "0x216696817bAF598Fa4cC4461AEB3CB34476E52Dc", qr: "public\img\qr_eth.png" }
  },
  USDT: {
    TRC20: { address: "TAx9KbxS2qh7mwafC3VX6gCGJP8tWVaK9R", qr: "public\img\qr_usdt_tr.png" },
    ERC20: { address: "0x216696817bAF598Fa4cC4461AEB3CB34476E52Dc", qr: "public\img\qr_usdterc.png" },
    BEP20: { address: "0x216696817bAF598Fa4cC4461AEB3CB34476E52Dc", qr: "public\img\qr_bnb.png" }
  },
  XRP: {
    XRP: { address: "rP4HSbDhBpMyTtSZJQxQtqsqiNQvovujRE", qr: "public\img\qr_xrp.png" }
  }
};

const coinEl = document.getElementById("coin");
const chainEl = document.getElementById("chain");

coinEl.addEventListener("change", () => {
  const coin = coinEl.value;
  chainEl.innerHTML = `<option value="">Select Chain</option>`;

  if (chainOptions[coin]) {
    chainOptions[coin].forEach(c => {
      chainEl.innerHTML += `<option value="${c}">${c}</option>`;
    });
  }
});

// FORM SUBMIT
let currentTxId = null;

document.getElementById("depositForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const logged = await ensureLoggedIn();
  if (!logged) {
    alert("Please log in to make a deposit.");
    return;
  }

  const coin = coinEl.value;
  const chain = chainEl.value;
  const amount = document.getElementById("amount").value;

  if (!chain) {
    document.getElementById("error").textContent = "Please select network!";
    document.getElementById("error").style.display = "block";
    return;
  }

  const res = await fetch(`${baseUrl}/api/deposit`, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    credentials: "include",
    body: JSON.stringify({ coin, chain, amount: parseFloat(amount) })
  });

  const data = await res.json();
  currentTxId = data.txId;

  const info = cryptoData[coin][chain];

  document.getElementById("exactAmount").textContent = amount;
  document.getElementById("coinSymbol").textContent = coin;
  document.getElementById("addressBox").textContent = info.address;

  document.getElementById("qrImage").src = info.qr;

  document.getElementById("txId").textContent = currentTxId;

  document.getElementById("depositForm").style.display = "none";
  document.getElementById("paymentSection").classList.add("active");
});

// Copy address
async function copyAddress() {
  const addr = document.getElementById("addressBox").textContent;
  await navigator.clipboard.writeText(addr);
  alert("Address copied!");
}

// Back
function goBack() {
  document.getElementById("paymentSection").classList.remove("active");
  document.getElementById("depositForm").style.display = "block";
}

// Check status
async function checkPaymentStatus() {
  const res = await fetch(`${baseUrl}/api/verify-payment`, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    credentials: "include",
    body: JSON.stringify({ txId: currentTxId })
  });

  const data = await res.json();
  const statusValue = document.getElementById("statusValue");

  if (data.status === "CONFIRMED") {
    statusValue.textContent = "Payment Confirmed!";
    statusValue.style.color = "#7ef6b8";
  } else {
    statusValue.textContent = "Awaiting Confirmation…";
  }
}
</script>

</body>
</html>
