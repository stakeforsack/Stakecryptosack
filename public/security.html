<!doctype html> 
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Security Settings</title>

  <style>
    :root{
      --bg1:#040406;
      --bg2:#08080b;
      --card:rgba(255,255,255,0.03);
      --muted:#9aa3b2;
      --accent:#00bcd4;
      --accent2:#4e9eff;
      --radius:14px;
    }

    *{margin:0;padding:0;box-sizing:border-box;font-family:"Inter",sans-serif;}

    body{
      background:linear-gradient(180deg,var(--bg1),var(--bg2));
      color:white;
      min-height:100vh;
      padding-bottom:100px;
      animation:fadeIn .5s ease;
    }

    @keyframes fadeIn{
      from{opacity:0;transform:translateY(10px)}
      to{opacity:1;transform:translateY(0)}
    }

    /* ===== HEADER ===== */
    .header{
      height:60px;
      display:flex;
      align-items:center;
      justify-content: center;
      padding:0 16px;
      background:linear-gradient(90deg,#0f0f12,#09090c,#0f0f12);
      border-bottom:1px solid rgba(255,255,255,0.05);
      color:#00bcd4;
      font-weight:600;
      letter-spacing:.4px;
      animation:hdrShift 5s ease infinite;
      position:relative;
    }

    @keyframes hdrShift{
      0%{background-position:0%}
      50%{background-position:100%}
      100%{background-position:0%}
    }

    /* BACK BUTTON */
    .back-btn{
      position:absolute;
      left:16px;
      display:flex;
      align-items:center;
      gap:6px;
      color:#9aa3b2;
      text-decoration:none;
      font-size:.9rem;
      transition:.25s ease;
    }
    .back-btn:hover{
      color:#00bcd4;
      transform:translateX(-3px);
    }

    /* ===== CARD ===== */
    .wrapper{
      max-width:450px;
      margin:26px auto;
      padding:16px;
    }

    .card{
      background:var(--card);
      padding:22px;
      border-radius:var(--radius);
      border:1px solid rgba(255,255,255,0.05);
      backdrop-filter:blur(8px);
      box-shadow:0 10px 30px rgba(0,0,0,0.5);
      animation:cardIn .6s ease;
    }

    @keyframes cardIn{
      from{opacity:0;transform:translateY(20px)}
      to{opacity:1;transform:translateY(0)}
    }

    h2{
      color:var(--accent);
      text-align:center;
      margin-bottom:20px;
      text-shadow:0 0 8px rgba(0,188,212,0.4);
    }

    h3{
      margin-top:0;
      margin-bottom:12px;
      color:var(--accent2);
      text-align:center;
      font-size:1.2rem;
    }

    /* INPUTS */
    label{color:var(--muted);font-size:.9rem;}

    input[type="password"]{
      width:100%;
      padding:12px;
      margin-top:6px;
      border-radius:10px;
      border:1px solid rgba(255,255,255,0.08);
      background:#0f0f12;
      color:white;
      font-size:1rem;
      transition:.25s ease;
    }

    input[type=password]:focus{
      border-color:var(--accent);
      box-shadow:0 0 8px rgba(0,188,212,.4);
      outline:none;
    }

    /* BUTTON */
    .btn{
      width:100%;
      margin-top:12px;
      padding:12px;
      border:none;
      border-radius:10px;
      background:linear-gradient(90deg,var(--accent),var(--accent2));
      font-weight:700;
      cursor:pointer;
      color:#021;
      transition:.25s ease;
    }
    .btn:hover{
      transform:scale(1.03);
      box-shadow:0 0 12px rgba(0,188,212,0.35);
    }

    /* 2FA CARD */
    .mini-card{
      margin-top:18px;
      padding:18px;
      background:rgba(255,255,255,0.02);
      border-radius:var(--radius);
      border:1px solid rgba(255,255,255,0.05);
    }

    .helper{color:var(--muted);font-size:.8rem;margin-top:8px;text-align:center}

    /* Bottom Navigation */
    .bottom-nav{
      position:fixed;bottom:14px;left:50%;transform:translateX(-50%);
      background:rgba(255,255,255,0.03);
      border:1px solid rgba(255,255,255,0.05);
      border-radius:999px;
      display:flex;gap:18px;
      padding:10px 18px;
      backdrop-filter:blur(6px);
    }
    .nav-item{
      text-decoration:none;
      color:#888;
      font-size:.75rem;
      display:flex;
      flex-direction:column;
      align-items:center;
      transition:.3s ease;
    }
    .nav-item.active{color:var(--accent);}
    .nav-item img{width:22px;filter:brightness(.75);margin-bottom:4px;}
    .nav-item:hover{color:var(--accent)}
  </style>
</head>

<body>

  <header class="header">
    <a class="back-btn" href="account.html">← Back</a>
    Security Settings
  </header>

  <div class="wrapper">

    <div class="card">
      <h2>Password Security</h2>

      <label>Current Password</label>
      <input id="curPass" type="password">

      <label style="margin-top:14px">New Password</label>
      <input id="newPass" type="password">

      <button class="btn" id="btnChange">Change Password</button>
    </div>

    <div class="mini-card">
      <h3>Two-Factor Authentication</h3>

      <div style="text-align:center;margin-top:10px;">
        <label style="display:flex;align-items:center;justify-content:center;gap:8px;color:#ccc;">
          <input id="chk2fa" type="checkbox"> Enable 2FA
        </label>

        <div class="helper">Requires authenticator code on login.</div>

        <button class="btn" id="btn2fa" style="margin-top:14px;">Save 2FA</button>
      </div>
    </div>

  </div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <a class="nav-item" href="home.html"><img src="/img/house.png"><p>Home</p></a>
    <a class="nav-item" href="trade.html"><img src="/img/trade.png"><p>Trade</p></a>
    <a class="nav-item" href="internal-transfer.html"><img src="/img/transfer.png"><p>Transfer</p></a>
    <a class="nav-item active" href="account.html"><img src="/img/myaccount.png"><p>Account</p></a>
  </nav>

  <script>
    document.getElementById('btnChange').addEventListener('click', async () => {
      const payload = {
        current: document.getElementById('curPass').value,
        password: document.getElementById('newPass').value
      };

      try{
        const res = await fetch('/api/change-password',{
          method:'POST',headers:{'Content-Type':'application/json'},
          credentials:'same-origin',body:JSON.stringify(payload)
        });

        const j = await res.json();
        if(res.ok) alert('Password updated successfully');
        else alert(j.error || 'Failed to change password');

      }catch(err){
        alert("Network error");
      }
    });

    document.getElementById('btn2fa').addEventListener('click', async () => {
      const enabled = document.getElementById('chk2fa').checked;

      try{
        const res = await fetch('/api/set-2fa',{
          method:'POST',headers:{'Content-Type':'application/json'},
          credentials:'same-origin',body:JSON.stringify({enabled})
        });

        if(res.ok) alert("2FA settings updated");
        else alert("Failed to update 2FA");

      }catch(err){
        alert("Network error");
      }
    });
  </script>

</body>
</html>
