<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support - CryptoYieldPro</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
  :root {
    --accent:#a855f7;
    --accent2:#5eead4;
    --muted:#9aa3b2;
    --glass:rgba(255,255,255,0.05);
  }

  body {
    margin:0;
    font-family:Inter, sans-serif;
    background:linear-gradient(180deg,#040406,#08080b);
    color:#fff;
    overflow-x:hidden;
  }

  /* Smooth fade-in */
  .fade { animation: fadeIn .8s ease forwards; opacity:0 }
  @keyframes fadeIn { to { opacity:1; transform:translateY(0);} }

  /* WRAP */
  .wrap {
    max-width:900px;
    margin:40px auto;
    padding:20px;
  }

  h1 {
    font-size:2rem;
    text-align:center;
    margin-bottom:20px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;
    color:transparent;
  }

  .card {
    background:var(--glass);
    padding:20px;
    border-radius:16px;
    border:1px solid rgba(255,255,255,0.06);
    box-shadow:0 10px 40px rgba(0,0,0,0.4);
    transform:translateY(20px);
    animation:fadeInUp .9s ease forwards;
  }

  @keyframes fadeInUp {
    to { transform:translateY(0); opacity:1; }
    from { opacity:0; }
  }

  label { color:var(--muted); font-size:0.9rem; font-weight:600; }
  input, textarea {
    width:100%;
    padding:12px;
    margin-top:6px;
    margin-bottom:16px;
    border-radius:10px;
    background:#0d0d0d;
    border:1px solid rgba(255,255,255,0.08);
    color:#fff;
    font-size:1rem;
  }

  textarea { height:120px; resize:none; }

  .btn {
    width:100%;
    padding:14px;
    font-weight:800;
    border:none;
    border-radius:12px;
    font-size:1rem;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    cursor:pointer;
    color:#021;
    transition:0.2s;
  }
  .btn:hover { transform:scale(1.03); }

  /* SUCCESS BUBBLE */
  .success-bubble {
    display:none;
    margin-top:12px;
    background:rgba(126,246,184,0.1);
    border:1px solid rgba(126,246,184,0.2);
    color:#7ef6b8;
    padding:10px;
    border-radius:12px;
    animation:pop .4s ease;
  }

  @keyframes pop {
    0% { transform:scale(.6); opacity:0; }
    100% { transform:scale(1); opacity:1; }
  }

  /* Chatbot floating button */
  .chat-btn {
    position:fixed;
    right:20px;
    bottom:20px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    width:60px;
    height:60px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 10px 30px rgba(0,0,0,0.5);
    animation:float 3s ease-in-out infinite;
  }

  @keyframes float {
    0%,100% { transform:translateY(0); }
    50% { transform:translateY(-8px); }
  }

  .chat-panel {
    position:fixed;
    right:20px;
    bottom:100px;
    width:320px;
    background:#0c0c0e;
    border-radius:16px;
    border:1px solid rgba(255,255,255,0.08);
    display:none;
    flex-direction:column;
    box-shadow:0 20px 40px rgba(0,0,0,0.6);
    animation:slideIn .5s ease forwards;
  }

  @keyframes slideIn {
    from { transform:translateY(40px); opacity:0 }
    to { transform:translateY(0); opacity:1 }
  }

  .chat-head {
    padding:14px;
    font-weight:700;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;
    color:transparent;
    border-bottom:1px solid rgba(255,255,255,0.06);
  }

  .chat-body {
    padding:14px;
    max-height:260px;
    overflow-y:auto;
    color:var(--muted);
  }

  .chat-input {
    border-top:1px solid rgba(255,255,255,0.08);
    padding:10px;
    display:flex;
    gap:10px;
  }

  .chat-input input{
    flex:1;
    padding:10px;
    border-radius:10px;
    background:#111;
    border:1px solid rgba(255,255,255,0.05);
    color:#fff;
  }
  .chat-input button{
    background:var(--accent);
    border:none;
    padding:10px 14px;
    border-radius:10px;
    cursor:pointer;
    font-weight:700;
  }

  .msg-bot {
    background:#151515;
    padding:10px 12px;
    border-radius:10px;
    margin-bottom:10px;
    animation:fadeIn .3s ease;
  }
  .msg-user {
    background:#5eead4;
    color:#000;
    padding:10px 12px;
    border-radius:10px;
    margin-bottom:10px;
    text-align:right;
    animation:fadeIn .3s ease;
  }
</style>
</head>

<body>

<div class="wrap fade">
  <h1>Customer Support</h1>

  <div class="card">
    <form id="supportForm">
      <label>Name</label>
      <input type="text" id="name" required>

      <label>Email</label>
      <input type="email" id="email" required>

      <label>Subject</label>
      <input type="text" id="subject" required>

      <label>Message</label>
      <textarea id="message" required></textarea>

      <button class="btn" type="submit">Submit Ticket</button>
      <div id="success" class="success-bubble">Ticket submitted successfully! ✔</div>
    </form>
  </div>
</div>

<!-- Floating Chatbot Button -->
<div class="chat-btn" id="chatToggle">
  💬
</div>

<!-- Chat Panel -->
<div class="chat-panel" id="chatPanel">
  <div class="chat-head">Support Assistant</div>
  <div class="chat-body" id="chatBody">
    <div class="msg-bot">Hello! How can I assist you today?</div>
  </div>

  <div class="chat-input">
    <input type="text" id="chatText" placeholder="Type a message...">
    <button id="chatSend">Send</button>
  </div>
</div>

<script>
// SUPPORT FORM
document.getElementById("supportForm").addEventListener("submit", (e)=>{
  e.preventDefault();
  document.getElementById("success").style.display = "block";
  setTimeout(()=>{ document.getElementById("success").style.display="none"; },3000);
});

// CHATBOT
let open = false;
const chatBtn = document.getElementById("chatToggle");
const chatPanel = document.getElementById("chatPanel");
const chatBody = document.getElementById("chatBody");

chatBtn.onclick = ()=>{
  open = !open;
  chatPanel.style.display = open ? "flex" : "none";
};

document.getElementById("chatSend").onclick = sendMsg;
document.getElementById("chatText").addEventListener("keydown", e=>{
  if(e.key==="Enter") sendMsg();
});

function sendMsg(){
  const text = document.getElementById("chatText").value.trim();
  if(!text) return;

  chatBody.innerHTML += `<div class='msg-user'>${text}</div>`;
  document.getElementById("chatText").value="";

  setTimeout(()=>{
    chatBody.innerHTML += `<div class='msg-bot'>Let me check that for you...</div>`;
    chatBody.scrollTop = chatBody.scrollHeight;
  },700);
}

</script>

</body>
</html>
