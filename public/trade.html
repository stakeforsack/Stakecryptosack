<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
  <title>Trade • Live Charts</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg1: #050507;
      --bg2: #0b0b12;
      --card: rgba(255,255,255,0.03);
      --border: rgba(255,255,255,0.06);
      --accent: #a855f7;
      --accent2: #5eead4;
      --success: #74ffb0;
      --danger: #ff5f77;
      --muted: #9aa3b2;
    }

    html,body{
      height:100%;
      margin:0;
      font-family: "Inter", "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(180deg, var(--bg1), var(--bg2));
      color:#eaf3ff;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* hide scrollbar for modern browsers */
    body::-webkit-scrollbar { display: none; }

    .wrap {
      max-width: 980px;
      margin: 18px auto 110px;
      padding: 12px;
    }

    .back-btn {
      position: fixed;
      top: 18px;
      left: 18px;
      background: rgba(255,255,255,0.06);
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.06);
      font-weight: 700;
      cursor: pointer;
      z-index: 40;
      color: #fff;
      backdrop-filter: blur(6px);
    }

    .header {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:10px;
    }

    .title {
      display:flex;
      flex-direction:column;
    }
    .title h1 {
      font-size: 1.4rem;
      margin: 0;
      font-weight: 800;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip:text; background-clip:text; color: transparent;
    }
    .title .sub {
      color:var(--muted);
      font-size:0.88rem;
      margin-top:4px;
    }

    /* coins list */
    .coins {
      display:grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    @media (max-width:720px){
      .wrap { padding:12px 10px; margin:12px auto 120px; }
      .coins { grid-template-columns: repeat(1, 1fr); }
    }
    .coin {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 12px;
      display:flex;
      gap:12px;
      align-items:center;
      transition: transform .18s ease, box-shadow .18s;
      cursor:pointer;
      min-height:64px;
      overflow:hidden;
    }
    .coin.active { transform: translateY(-4px); box-shadow:0 8px 30px rgba(168,85,247,0.14); border-color: var(--accent); }
    .coin .img {
      width:44px; height:44px; flex:0 0 44px;
      display:flex;align-items:center;justify-content:center;border-radius:10px;background:#0b0b0d;
    }
    .coin img { width:28px; height:28px; object-fit:contain; }
    .coin .meta { flex:1; min-width:0; }
    .coin .name { font-weight:700; font-size:0.98rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .coin .pair { font-size:0.78rem; color:var(--muted); margin-top:3px; }
    .coin .priceRow{ display:flex; gap:10px; align-items:center; margin-left:auto; flex-direction:column; align-items:flex-end; }
    .coin .price { font-weight:800; font-size:0.95rem; color:#fff; }
    .change.pos { color:var(--success); font-weight:700; }
    .change.neg { color:var(--danger); font-weight:700; }

    /* chart box */
    #chartBox{
      margin-top:16px;
      background:var(--card);
      border-radius:14px;
      border:1px solid var(--border);
      padding:12px;
      box-shadow:0 6px 26px rgba(0,0,0,0.45);
      display:none;
      overflow:hidden;
    }
    #chartTitle { font-weight:800; font-size:1.05rem; margin:6px 0; }
    #chartWrap { width:100%; height:280px; position:relative; }

    /* loader */
    .loader { font-size:0.9rem; color:var(--muted); }

    /* periods */
    .periods { margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; }
    .periods button {
      padding:8px 10px; border-radius:8px; border:none; background:transparent; color:var(--muted);
      cursor:pointer; font-weight:700;
      border:1px solid transparent;
    }
    .periods button.active { background:linear-gradient(90deg,var(--accent),var(--accent2)); color:#041; border:1px solid rgba(0,0,0,0.08); }

    /* bottom nav - kept same style but ensure no overlap */
    .bottom-nav {
      position: fixed;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 22px;
      padding: 8px 14px;
      display: flex;
      gap: 18px;
      z-index: 999;
    }
    .nav-item { text-align:center; font-size:0.82rem; color:var(--muted); text-decoration:none; display:flex;flex-direction:column; align-items:center; gap:4px; }
    .nav-item img{ width:20px; height:20px; }

    /* small responsive tweaks */
    @media (max-width:420px){
      #chartWrap { height:220px; }
      .coin .priceRow{ flex-direction:row; gap:12px; align-items:center; }
      .coin .price { font-size:0.95rem; }
    }
  </style>
</head>
<body>
  <div class="back-btn" onclick="location.href='home.html'">← Back</div>

  <div class="wrap">
    <div class="header">
      <div class="title">
        <h1>Markets & Live Chart</h1>
        <div class="sub">Tap a coin to view its price chart (no order book).</div>
      </div>
    </div>

    <div id="coinsList" class="coins" aria-live="polite">
      <!-- coins rendered by trade.js -->
    </div>

    <div id="chartBox">
      <div id="chartTitle">—</div>
      <div id="chartWrap">
        <canvas id="priceChart" width="800" height="400"></canvas>
      </div>

      <div class="periods" aria-hidden="false">
        <button id="btn1h">1H</button>
        <button id="btn6h">6H</button>
        <button id="btn1d" class="active">1D</button>
      </div>

      <div style="height:8px"></div>
      <div id="chartLoader" class="loader" style="display:none;">Loading chart…</div>
    </div>
  </div>

  <!-- bottom nav -->
  <nav class="bottom-nav" role="navigation" aria-label="main">
    <a class="nav-item" href="home.html"><img src="/img/house.png"><div>Home</div></a>
    <a class="nav-item active" href="trade.html"><img src="/img/trade.png"><div>Trade</div></a>
    <a class="nav-item" href="internal-transfer.html"><img src="/img/transfer.png"><div>Transfer</div></a>
    <a class="nav-item" href="account.html"><img src="/img/myaccount.png"><div>Account</div></a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="/js/market-prices.js"></script>
  <script src="/js/trade.js"></script>
</body>
</html>
