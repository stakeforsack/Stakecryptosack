<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Profile Settings — CryptoYieldPro</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg1:#050507;
      --bg2:#0a0a0d;
      --accent:#a855f7;
      --accent2:#5eead4;
      --muted:#9aa3b2;
    }

    *{margin:0;padding:0;box-sizing:border-box;font-family:Inter;-webkit-tap-highlight-color:transparent}

    body{
      background:linear-gradient(180deg,var(--bg1),var(--bg2));
      min-height:100vh;
      color:#e6eef8;
      padding-bottom:90px;
      animation:fadeIn .6s ease;
    }

    @keyframes fadeIn{
      from{opacity:0;transform:translateY(10px)}
      to{opacity:1;transform:translateY(0)}
    }

    /* HEADER */
    .header{
      position:relative;
      height:60px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:rgba(255,255,255,0.02);
      border-bottom:1px solid rgba(255,255,255,0.05);
      backdrop-filter:blur(10px);
      font-weight:700;
      font-size:1.1rem;
      color:#fff;
      letter-spacing:0.5px;
    }

    /* BACK BTN */
    .back-btn{
      position:absolute;
      left:16px;
      top:50%;
      transform:translateY(-50%);
      background:rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.08);
      padding:6px 14px;
      border-radius:8px;
      color:#fff;
      font-size:.85rem;
      cursor:pointer;
      transition:.25s;
    }
    .back-btn:hover{
      background:rgba(255,255,255,0.1);
    }

    /* MAIN WRAPPER */
    .wrap{
      max-width:460px;
      margin:30px auto;
      padding:20px;
    }

    /* CARD */
    .card{
      background:linear-gradient(180deg,rgba(255,255,255,0.03),rgba(255,255,255,0.015));
      padding:22px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,0.05);
      box-shadow:0 10px 40px rgba(0,0,0,0.5);
      animation:cardIn .6s ease forwards;
      transform:translateY(10px);
      opacity:0;
    }

    @keyframes cardIn{
      to{transform:translateY(0);opacity:1}
    }

    h2{
      text-align:center;
      color:var(--accent2);
      margin-bottom:18px;
      font-size:1.5rem;
      text-shadow:0 0 12px rgba(94,234,212,0.2);
    }

    label{
      display:block;
      margin-bottom:6px;
      color:var(--muted);
      font-size:0.9rem;
    }

    input, textarea{
      width:100%;
      padding:12px;
      border-radius:10px;
      border:1px solid rgba(255,255,255,0.05);
      background:#0e0e11;
      color:#fff;
      font-size:1rem;
      transition:.25s;
    }

    input:focus, textarea:focus{
      outline:none;
      border-color:var(--accent);
      box-shadow:0 0 8px rgba(168,85,247,0.4);
    }

    /* BUTTON */
    .save-btn{
      width:100%;
      padding:14px;
      margin-top:18px;
      border:none;
      border-radius:10px;
      background:linear-gradient(90deg,var(--accent),var(--accent2));
      color:#021;
      font-weight:700;
      font-size:1rem;
      cursor:pointer;
      transition:.25s;
    }

    .save-btn:hover{
      transform:scale(1.03);
      box-shadow:0 4px 14px rgba(168,85,247,0.4);
    }

    /* MESSAGE */
    .message{
      margin-top:12px;
      text-align:center;
      opacity:0;
      transition:.3s;
      font-size:.9rem;
    }
    .message.show{opacity:1}
    .message.success{color:#7ef6b8}
    .message.error{color:#ff7171}

    /* BOTTOM NAV */
    .bottom-nav{
      position:fixed;
      bottom:16px;
      left:50%;
      transform:translateX(-50%);
      display:flex;
      gap:22px;
      background:rgba(255,255,255,0.03);
      border:1px solid rgba(255,255,255,0.05);
      padding:12px 22px;
      border-radius:999px;
      backdrop-filter:blur(8px);
      z-index:999;
    }
    .nav-item{
      color:#888;
      text-decoration:none;
      font-size:.75rem;
      text-align:center;
      transition:.25s;
    }
    .nav-item img{
      width:22px;height:22px;
      margin-bottom:4px;
      filter:brightness(.7);
    }
    .nav-item:hover, .nav-item.active{
      color:var(--accent);
      transform:translateY(-2px);
    }
    .nav-item:hover img, .nav-item.active img{
      filter:brightness(1);
    }
  </style>
</head>

<body>

  <div class="header">
    Profile Settings
    <button class="back-btn" onclick="location.href='account.html'">← Back</button>
  </div>

  <div class="wrap">
    <div class="card">

      <h2>Edit Profile</h2>

      <label>Username</label>
      <input id="inpUsername" type="text">

      <label>Email</label>
      <input id="inpEmail" type="email">

      <label>Bio</label>
      <textarea id="inpBio" rows="4"></textarea>

      <button class="save-btn" id="btnSave">Save Changes</button>
      <div id="message" class="message"></div>

    </div>
  </div>

  <nav class="bottom-nav">
    <a class="nav-item" href="home.html"><img src="/img/house.png"><p>Home</p></a>
    <a class="nav-item" href="trade.html"><img src="/img/trade.png"><p>Trade</p></a>
    <a class="nav-item" href="internal-transfer.html"><img src="/img/transfer.png"><p>Transfer</p></a>
    <a class="nav-item active" href="account.html"><img src="/img/myaccount.png"><p>Account</p></a>
  </nav>

  <script>
    async function loadProfile() {
      try {
        const res = await fetch('/api/user-profile', { credentials: 'same-origin' });
        if (!res.ok) return;

        const data = await res.json();
        document.getElementById('inpUsername').value = data.username || '';
        document.getElementById('inpEmail').value = data.email || '';
        document.getElementById('inpBio').value = data.bio || '';
      } catch (e) {}
    }

    function showMessage(text, type="success") {
      const msg = document.getElementById("message");
      msg.textContent = text;
      msg.className = "message show " + type;
      setTimeout(()=> msg.classList.remove("show"), 3000);
    }

    document.getElementById("btnSave").onclick = async () => {
      const body = {
        username: inpUsername.value.trim(),
        email: inpEmail.value.trim(),
        bio: inpBio.value.trim()
      };

      if (!body.username || !body.email) {
        return showMessage("Please enter required fields", "error");
      }

      try {
        const res = await fetch("/api/update-profile", {
          method:"POST",
          credentials:"same-origin",
          headers:{ "Content-Type":"application/json" },
          body:JSON.stringify(body)
        });

        const data = await res.json();
        if (res.ok) showMessage("Saved successfully!", "success");
        else showMessage(data.error || "Save failed", "error");

      } catch {
        showMessage("Network error", "error");
      }
    };

    loadProfile();
  </script>

</body>
</html>
