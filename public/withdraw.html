<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Withdraw | CryptoYieldPro</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --accent: #a855f7;
      --accent2: #5eead4;
      --bg1: #050509;
      --bg2: #0b0b11;
      --card: rgba(255,255,255,0.04);
      --glass: rgba(255,255,255,0.06);
      --muted: #9aa3b2;
      --error: #ff6b6b;
      --success: #7ef6b8;
    }

    body {
      margin: 0;
      background: linear-gradient(180deg,var(--bg1),var(--bg2));
      font-family: Inter, sans-serif;
      color: #fff;
      min-height: 100vh;
      padding-bottom: 80px;
    }

    .back-btn {
      position: fixed;
      top: 18px;
      left: 18px;
      background: rgba(255,255,255,0.08);
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.1);
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(6px);
      z-index: 30;
    }

    .wrap {
      width: 92%;
      margin: 80px auto 0;
    }

    .card {
      background: var(--glass);
      padding: 24px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.06);
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 18px rgba(0,0,0,0.5);
      animation: fadeIn .5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    h2 {
      font-size: 1.7rem;
      font-weight: 800;
      text-align: center;
      background: linear-gradient(90deg,var(--accent),var(--accent2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 22px;
    }

    label { display:block; margin-bottom:6px; font-size:.9rem; color:var(--muted); font-weight:600; }

    input, select {
      width: 90%;
      padding: 14px;
      border-radius: 12px;
      background: #0d0d12;
      border: 1px solid rgba(255,255,255,0.08);
      color: #fff;
      font-size: 1rem;
      outline: none;
      margin-bottom: 12px;
    }
    input:focus, select:focus { border-color: var(--accent); }

    .balance-box {
      background: #0e0e13;
      padding: 16px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.06);
      margin-bottom: 18px;
      display: flex;
      justify-content: space-between;
      font-weight: 700;
      color: var(--accent2);
    }

    .primary-btn {
      width: 100%;
      margin-top: 10px;
      padding: 15px;
      border-radius: 12px;
      background: linear-gradient(90deg,var(--accent),var(--accent2));
      color: #031;
      border: none;
      font-weight: 800;
      cursor: pointer;
      transition: 0.25s;
      font-size: 1rem;
    }
    .primary-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .status-box {
      margin-top: 18px;
      padding: 16px;
      border-radius: 14px;
      background: rgba(126,246,184,0.1);
      border: 1px solid rgba(126,246,184,0.2);
      color: var(--success);
      font-weight: 700;
      display: none;
    }

    .processing {
      margin-top: 20px;
      padding: 18px;
      border-radius: 14px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      text-align: center;
      display: none;
      animation: fadeIn .4s ease;
    }

    .spinner {
      width: 26px;
      height: 26px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: var(--accent2);
      border-radius: 50%;
      margin: 0 auto 10px;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* bottom nav */
    .bottom-nav {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 26px;
      padding: 12px 20px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.04);
      backdrop-filter: blur(10px);
      border-radius: 20px;
    }
    .nav-item { text-align:center; font-size:0.8rem; color:var(--muted); }
    .nav-item.active { color: var(--accent); }
    .nav-item img { width:22px; }
  </style>
</head>

<body>
<div class="back-btn" onclick="location.href='home.html'">← Back</div>

<div class="wrap">
  <div class="card" id="formCard">

    <h2>Withdraw Funds</h2>

    <div class="balance-box">
      <span>Available</span>
      <span id="balance">Loading...</span>
    </div>

    <form id="withdrawForm" onsubmit="return false;">

      <label>Select Currency</label>
      <select id="currency">
        <option value="USDT">USDT</option>
        <option value="BTC">BTC</option>
        <option value="ETH">ETH</option>
        <option value="BNB">BNB</option>
        <option value="ADA">ADA</option>
      </select>

      <label>Wallet Address</label>
      <input id="wallet" placeholder="Enter your wallet address">

      <label>Amount</label>
      <input id="amount" type="number" placeholder="0.00">

      <button class="primary-btn" id="submitBtn" type="button">Withdraw</button>

      <div class="status-box" id="successBox"></div>
      <div class="error" id="error"></div>

    </form>

  </div>

  <!-- PROCESSING BOX -->
  <div class="processing" id="processingBox">
    <div class="spinner"></div>
    <div style="font-weight:700;">Processing Withdrawal...</div>
  </div>

  <!-- PENDING RESULT -->
  <div class="card" style="display:none;" id="pendingCard">
    <h2 style="margin-bottom:10px;">Request Submitted</h2>
    <p style="color:var(--muted); font-size:0.9rem; margin-bottom:20px;">Your withdrawal request is now <b style="color:var(--accent2)">PENDING</b>.  
      Admin will approve it shortly.</p>

    <div style="background:#0d0d12; padding:14px; border-radius:12px; border:1px solid rgba(255,255,255,0.06); margin-bottom:10px;">
      <b>Amount:</b> <span id="p_amount"></span>
    </div>

    <div style="background:#0d0d12; padding:14px; border-radius:12px; border:1px solid rgba(255,255,255,0.06); margin-bottom:10px;">
      <b>Wallet:</b> <span id="p_wallet"></span>
    </div>

    <div style="background:#0d0d12; padding:14px; border-radius:12px; border:1px solid rgba(255,255,255,0.06);">
      <b>Transaction ID:</b> <span id="p_txid"></span>
    </div>

  </div>

</div>

<!-- bottom navigation -->
<nav class="bottom-nav">
  <a class="nav-item" href="home.html"><img src="/img/house.png"><br>Home</a>
  <a class="nav-item" href="trade.html"><img src="/img/trade.png"><br>Trade</a>
  <a class="nav-item active" href="withdraw.html"><img src="/img/withdraw.png"><br>Withdraw</a>
  <a class="nav-item" href="account.html"><img src="/img/myaccount.png"><br>Account</a>
</nav>

<script>
(function () {
  const balanceEl = document.getElementById("balance");
  const currencyEl = document.getElementById("currency");
  const walletEl = document.getElementById("wallet");
  const amountEl = document.getElementById("amount");
  const submitBtn = document.getElementById("submitBtn");
  const errorBox = document.getElementById("error");
  const successBox = document.getElementById("successBox");

  const formCard = document.getElementById("formCard");
  const processingBox = document.getElementById("processingBox");
  const pendingCard = document.getElementById("pendingCard");

  const p_amount = document.getElementById("p_amount");
  const p_wallet = document.getElementById("p_wallet");
  const p_txid   = document.getElementById("p_txid");

  async function loadBalance() {
    try {
      const res = await fetch(`/api/balances`, { credentials:"include" });
      const data = await res.json();
      const coin = currencyEl.value;
      const value = Number(data.balances[coin] || 0);
      balanceEl.textContent = `${value.toFixed(6)} ${coin}`;
    } catch {
      balanceEl.textContent = "Error";
    }
  }

  currencyEl.addEventListener("change", loadBalance);
  window.addEventListener("DOMContentLoaded", loadBalance);

  function showError(msg){
    errorBox.style.display = "block";
    errorBox.innerHTML = msg;
  }

  submitBtn.addEventListener("click", async () => {
    errorBox.style.display = "none";
    successBox.style.display = "none";

    const coin = currencyEl.value;
    const wallet = walletEl.value.trim();
    const amount = Number(amountEl.value);

    if(!wallet) return showError("Enter wallet address.");
    if(!amount || amount<=0) return showError("Enter valid amount.");

    submitBtn.disabled = true;
    submitBtn.innerText = "Submitting...";

    formCard.style.display = "none";
    processingBox.style.display = "block";

    try {
      const res = await fetch("/api/withdraw",{
        method:"POST",
        credentials:"include",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({ coin, amount, wallet })
      });

      const json = await res.json();
      if(!res.ok){ throw new Error(json.error || "Submit failed"); }

      processingBox.style.display = "none";

      p_amount.innerText = amount+" "+coin;
      p_wallet.innerText = wallet;
      p_txid.innerText = json.txId;

      pendingCard.style.display = "block";
    }
    catch(err) {
      processingBox.style.display = "none";
      formCard.style.display = "block";
      showError(err.message);
    }
    finally{
      submitBtn.disabled = false;
      submitBtn.innerText = "Withdraw";
    }
  });

})();
</script>

</body>
</html>
